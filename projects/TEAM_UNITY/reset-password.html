<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TEAM UNITY | Reset Password</title>

    <link
        rel="stylesheet"
        href="styles/style.css"
    >

</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <img
                src="src/Brand_logox2.png"
                class="login-logo"
                alt="Team Unity"
            >

            <h1>Reset Password</h1>

            <p>
                Create your new password.
            </p>


            <form id="resetPasswordForm">

                <label for="newPassword">
                    New Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                </div>


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                </div>


                <button type="submit">
                    Reset Password
                </button>

            </form>


            <p id="resetMessage"></p>


            <p class="register-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="scripts/reset-password.js"></script>

</body>

</html>
