<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TEAM UNITY | Forgot Password</title>

    <link
        rel="stylesheet"
        href="styles/Forgot-password.css"
    >

    <link
        rel="stylesheet"
        href="styles/style.css"
    >
</head>

<body>

    <main class="login-page">

        <div class="login-box">
            
            <div clsss="login-head">

            <img
                src="src/unity_logo.png"
                class="login-logo"
                alt="Team Unity"
            ></img>

            <h1>Forgot Password?</h1> </div>

            <p>
                Enter your email to reset your password.
            </p>


            <form id="forgotPasswordForm">

                <label for="forgotEmail">
                    Email
                </label>

                <div class="input-box">

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <button type="submit">
                    Reset Password
                </button>

            </form>


            <p id="forgotMessage"></p>

            <p class="register-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="scripts/forgot-password.js"></script>

</body>

</html>
