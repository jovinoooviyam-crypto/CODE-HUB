<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TEAM UNITY | Profile</title>

    <link
        rel="stylesheet"
        href="styles/dashboard.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="dashboard">

        <!-- PROFILE -->

        <section class="profile-section">

            <div class="profile-picture-container">

                <img
                    id="profilePicture"
                    class="profile-picture"
                    src=""
                    alt="Profile Picture"
                    referrerpolicy="no-referrer"
                >

            </div>


            <h1 id="userName">
                Loading...
            </h1>


            <p id="userRole">
                Loading...
            </p>

        </section>


        <!-- USER INFORMATION -->

        <section class="user-info">

            <div class="info-item">

                <span class="info-label">
                    Email
                </span>

                <span
                    id="userEmail"
                    class="info-value"
                >
                    Loading...
                </span>

            </div>


            <div class="info-item">

                <span class="info-label">
                    Date of Birth
                </span>

                <span
                    id="userDob"
                    class="info-value"
                >
                    Loading...
                </span>

            </div>


            <div class="info-item">

                <span class="info-label">
                    Profession
                </span>

                <span
                    id="userProfession"
                    class="info-value"
                >
                    Loading...
                </span>

            </div>

        </section>


        <!-- LOGOUT -->

        <button
            type="button"
            id="logoutBtn"
        >
            Logout
        </button>

    </main>


    <script src="scripts/dashboard.js"></script>

</body>

</html>
